<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>M1 scratch: study area boundaries</title>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  body { margin: 0; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
<div id="map"></div>
<script>
const map = new maplibregl.Map({
  container: "map",
  style: "https://demotiles.maplibre.org/style.json",
  center: [-73.991, 40.715],
  zoom: 14,
});

const colors = {
  "Chinatown": "#e67e22",
  "Two Bridges": "#3498db",
  "Lower East Side": "#2ecc71",
};

map.on("load", () => {
  fetch("../../pipeline/study_area/boundaries.geojson")
    .then((r) => r.json())
    .then((geojson) => {
      map.addSource("study-areas", { type: "geojson", data: geojson });
      map.addLayer({
        id: "study-areas-fill",
        type: "fill",
        source: "study-areas",
        paint: {
          "fill-color": ["match", ["get", "name"], "Chinatown", colors["Chinatown"], "Two Bridges", colors["Two Bridges"], "Lower East Side", colors["Lower East Side"], "#999"],
          "fill-opacity": 0.35,
        },
      });
      map.addLayer({
        id: "study-areas-line",
        type: "line",
        source: "study-areas",
        paint: {
          "line-color": ["match", ["get", "name"], "Chinatown", colors["Chinatown"], "Two Bridges", colors["Two Bridges"], "Lower East Side", colors["Lower East Side"], "#999"],
          "line-width": 2,
        },
      });
      map.on("click", "study-areas-fill", (e) => {
        const p = e.features[0].properties;
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(`<strong>${p.name}</strong><p style="max-width:300px">${p.definition_note}</p>`)
          .addTo(map);
      });
    });
});
</script>
</body>
</html>
